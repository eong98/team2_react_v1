# allimio React 컨테이너 내부 nginx 설정
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router(SPA): /user/dashboard 같은 주소로 새로고침해도 index.html을 내려줘서 404 방지
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 캐시하지 않음 → 새로 배포하면 사용자가 Ctrl+F5 없이 바로 새 버전을 받음
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /assets/*.js, *.css는 파일명에 해시가 붙어(index-3mvOrw-5.css) 내용이 바뀌면 이름도 바뀜 → 오래 캐시해도 안전
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
