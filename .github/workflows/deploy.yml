# =====================================================================
# main 브랜치에 push → React 이미지 빌드 → GHCR 업로드 → 서버(minikube)에 배포
# 필요한 GitHub Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
# =====================================================================
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:                 # Actions 탭에서 수동 실행도 가능

concurrency:
  group: deploy-web
  cancel-in-progress: false          # 배포 중간에 끊지 않고 순서대로 처리

permissions:
  contents: read
  packages: write                    # GHCR에 이미지 push 권한

env:
  IMAGE: ghcr.io/eong98/allimio-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 & 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 서버(minikube)에 배포
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          # IMAGE_TAG를 이번 커밋 SHA로 바꿔서 서버의 kubectl에 그대로 전달
          # 롤아웃이 5분 안에 끝나지 않으면(새 Pod 실패) 이전 버전으로 자동 되돌리고 실패 처리
          sed "s|IMAGE_TAG|${GITHUB_SHA}|g" k8s/web.yaml | \
            ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" '
              kubectl apply -f - &&
              kubectl -n allimio rollout status deployment/allimio-web --timeout=300s ||
              { kubectl -n allimio rollout undo deployment/allimio-web; exit 1; }
            '
